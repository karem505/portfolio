[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect old netlify domain to new custom domain
[[redirects]]
  from = "https://abo-elmakarem.netlify.app/*"
  to = "https://aboelmakarem.pro/:splat"
  status = 301
  force = true

# Redirect www to non-www (canonical)
[[redirects]]
  from = "https://www.aboelmakarem.pro/*"
  to = "https://aboelmakarem.pro/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Prevent caching for dynamic OG images
[[headers]]
  for = "/api/og"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    CDN-Cache-Control = "no-cache"
    Netlify-CDN-Cache-Control = "no-cache"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/profile.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Favicon caching
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
